name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: Build, lint, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  catalogue:
    name: Catalogue size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Report what the server advertises to a model (tools/list + instructions).
      - run: npm run measure
      # Fails when the catalogue exceeds its ceilings (asserted in test/server.test.ts).
      - name: Enforce catalogue ceilings
        run: node --import tsx --test --test-name-pattern "catalogue size stays under its ceiling" test/server.test.ts
